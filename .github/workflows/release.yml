name: Android Release Build (APK + AAB)

on:
  push:
    tags:
      - 'v*'
      - 'v*.*.*'
    branches:
      - main
      - master
    paths:
      - 'pubspec.yaml'
  workflow_dispatch:
    inputs:
      create_github_release:
        description: 'Publish as a GitHub Release (requires release tag or version)'
        required: false
        type: boolean
        default: false

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-release:
    name: Build Signed Release APK & AAB
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
          cache-key: "flutter-:os:-:channel:-:version:-:arch:-:hash:"

      - name: Print Flutter & Environment Details
        run: |
          flutter --version
          java -version

      - name: Configure Release Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "✓ Found KEYSTORE_BASE64 secret in GitHub Secrets. Decoding production release keystore..."
            echo "$KEYSTORE_BASE64" | base64 -d > android/app/chargeeasy-release.jks
            
            echo "storePassword=${KEYSTORE_PASSWORD:-ChargeEasy@2026!ReleaseKey}" > android/key.properties
            echo "keyPassword=${KEY_PASSWORD:-ChargeEasy@2026!ReleaseKey}" >> android/key.properties
            echo "keyAlias=${KEY_ALIAS:-chargeeasy}" >> android/key.properties
            echo "storeFile=chargeeasy-release.jks" >> android/key.properties
            echo "✓ Configured production release signing key.properties"
          else
            echo "⚠️ ======================================================================"
            echo "⚠️ WARNING: KEYSTORE_BASE64 secret is not set in GitHub repository settings!"
            echo "⚠️ Add your 4 secrets at:"
            echo "⚠️ https://github.com/${{ github.repository }}/settings/secrets/actions"
            echo "⚠️"
            echo "⚠️ Generating fallback release key so CI build succeeds..."
            echo "⚠️ ======================================================================"
            
            keytool -genkeypair -v -keystore android/app/chargeeasy-release.jks \
              -alias chargeeasy -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "ChargeEasy@2026!ReleaseKey" -keypass "ChargeEasy@2026!ReleaseKey" \
              -dname "CN=ChargeEasy, OU=CI, O=ChargeEasy, L=Bengaluru, ST=Karnataka, C=IN"
              
            echo "storePassword=ChargeEasy@2026!ReleaseKey" > android/key.properties
            echo "keyPassword=ChargeEasy@2026!ReleaseKey" >> android/key.properties
            echo "keyAlias=chargeeasy" >> android/key.properties
            echo "storeFile=chargeeasy-release.jks" >> android/key.properties
            echo "✓ Fallback keystore created. Release build will proceed successfully."
          fi
          ls -la android/app/chargeeasy-release.jks

      - name: Install Flutter Dependencies
        run: flutter pub get

      - name: Run Static Analysis
        run: flutter analyze

      - name: Run Unit Tests
        run: flutter test

      - name: Extract App Version
        id: get_version
        run: |
          RAW_VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: //')
          VERSION_NAME=$(echo "$RAW_VERSION" | cut -d '+' -f 1)
          VERSION_CODE=$(echo "$RAW_VERSION" | cut -d '+' -f 2)
          echo "version=$RAW_VERSION" >> $GITHUB_OUTPUT
          echo "version_name=$VERSION_NAME" >> $GITHUB_OUTPUT
          echo "version_code=$VERSION_CODE" >> $GITHUB_OUTPUT
          echo "App Version: $RAW_VERSION (Name: $VERSION_NAME, Code: $VERSION_CODE)"

      - name: Build Release APK (Testing / Direct Distribution)
        run: flutter build apk --release --android-skip-build-dependency-validation

      - name: Build Release App Bundle (Google Play Store)
        run: flutter build appbundle --release --android-skip-build-dependency-validation

      - name: Verify Signed Artifacts
        run: |
          echo "Verifying generated release binaries:"
          ls -lh build/app/outputs/flutter-apk/app-release.apk
          ls -lh build/app/outputs/bundle/release/app-release.aab

          # Copy to release folder with versioned names
          mkdir -p build/dist
          cp build/app/outputs/flutter-apk/app-release.apk build/dist/ChargeTracker-v${{ steps.get_version.outputs.version_name }}.apk
          cp build/app/outputs/bundle/release/app-release.aab build/dist/ChargeTracker-v${{ steps.get_version.outputs.version_name }}.aab

      - name: Upload Release Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ChargeTracker-release-v${{ steps.get_version.outputs.version_name }}
          path: |
            build/dist/*.apk
            build/dist/*.aab
          retention-days: 30

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main' || github.event.inputs.create_github_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.get_version.outputs.version_name }}
          name: "Charge Tracker v${{ steps.get_version.outputs.version_name }}"
          files: |
            build/dist/*.apk
            build/dist/*.aab
          generate_release_notes: true
          draft: false
          prerelease: false
